name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
  # The server's MCP_RESOURCE_URL changes when it is deployed, not when this repo changes.
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Without it the runner's cached 24.x is used, which lags behind security releases.
          check-latest: true
      - run: npm test
      - run: npm run validate
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
      - run: npm run check:endpoint
